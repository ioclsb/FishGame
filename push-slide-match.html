        'M68 60 Q73 71 67 81 Q62 90 68 96',
      ].map((d, i) => `<path d="${d}" fill="none" stroke="#d9c6ff" stroke-width="4.2" stroke-linecap="round" opacity="${0.95 - i * 0.08}"/>`).join('');
      return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs>
        ${grad('d', '#cf9bff', '#8a4be0')}
        <radialGradient id="${pre}gl" cx="0.35" cy="0.3" r="0.9">
          <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/></radialGradient></defs>
        ${wrap(`${tents}
        <path d="M20 55 A30 30 0 0 1 80 55 Q70 61 60 56 Q50 61 40 56 Q30 61 20 55 Z" fill="url(#${pre}d)" stroke="${OUT}" stroke-width="2.4"/>
        <ellipse cx="42" cy="40" rx="16" ry="10" fill="url(#${pre}gl)"/>
        <circle cx="40" cy="47" r="3.2" fill="#fff"/><circle cx="60" cy="47" r="3.2" fill="#fff"/>`)}
        </svg>`;
    }
    case 6: { // 小红蟹 crab
      const leg = (sx, flip) =>
        `<path d="M${sx} 58 q${flip * -14} 4 ${flip * -19} 14 q${flip * -3} 7 ${flip * -8} 9" fill="none" stroke="#c93a2c" stroke-width="5.5" stroke-linecap="round"/>`;
      return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs>
        ${grad('b', '#ff8a70', '#e83a28')}
        ${grad('c', '#ffa38c', '#f04b38')}</defs>
        ${wrap(`${leg(34, 1)}${leg(66, -1)}
        <path d="M30 44 Q18 34 20 24" fill="none" stroke="#e8503a" stroke-width="6" stroke-linecap="round"/>
        <path d="M70 44 Q82 34 80 24" fill="none" stroke="#e8503a" stroke-width="6" stroke-linecap="round"/>
        <circle cx="20" cy="20" r="9" fill="url(#${pre}c)" stroke="${OUT}" stroke-width="2"/>
        <path d="M26 15 L31 9 L28 18 Z" fill="#ffe9e2"/>
        <circle cx="80" cy="20" r="9" fill="url(#${pre}c)" stroke="${OUT}" stroke-width="2"/>
        <path d="M74 15 L69 9 L72 18 Z" fill="#ffe9e2"/>
        <ellipse cx="50" cy="58" rx="26" ry="19" fill="url(#${pre}b)" stroke="${OUT}" stroke-width="2.4"/>
        <path d="M36 40 L38 30 M64 40 L62 30" stroke="${OUT}" stroke-width="2.6" stroke-linecap="round"/>
        <circle cx="38" cy="28" r="4.6" fill="#fff"/><circle cx="38" cy="28" r="2.3" fill="#20242c"/>
        <circle cx="62" cy="28" r="4.6" fill="#fff"/><circle cx="62" cy="28" r="2.3" fill="#20242c"/>
        <path d="M42 62 Q50 68 58 62" fill="none" stroke="${OUT}" stroke-width="2.4" stroke-linecap="round"/>`)}
        </svg>`;
    }
  }
  return '';
}

function svgDataUri(svg) {
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

function roundRectPath(ctx, x, y, w, h, r) {
  if (ctx.roundRect) { ctx.roundRect(x, y, w, h, r); return; }
  r = Math.min(r, w / 2, h / 2);
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

class RenderView {
  // Returns a baked tile sprite (canvas) for the pattern at the current
  // geometry. The glossy tile paints synchronously; the SVG creature is
  // composited asynchronously and replaces the sprite when ready.
  static spriteFor(pattern) {
    if (!RenderView._sprites) {
      RenderView._sprites = {};
      RenderView.onChange = null;
    }
    const key = pattern + '@' + G.cell + '@' + G.dpr;
    const cached = RenderView._sprites[key];
    if (cached) return cached.final || cached.base;
    // Purge ONLY entries baked for a stale geometry. Never wipe siblings:
    // the render loop walks blocks pattern-by-pattern, so a full wipe here
    // turned every frame into a full re-bake storm (canvas churn + SVG
    // re-decodes) - the classic "memory climbs and everything lags" bug.
    const geo = '@' + G.cell + '@' + G.dpr;
    for (const k of Object.keys(RenderView._sprites)) {
      if (!k.endsWith(geo)) delete RenderView._sprites[k];
    }
    const base = RenderView._bakeTile(pattern);
    const entry = { base, final: null };
    RenderView._sprites[key] = entry;
    RenderView._bakeCreature(pattern, key, entry);
    return base;
  }

  static _tileCanvas() {
    const s = document.createElement('canvas');
    s.width = G.cell * G.dpr; s.height = G.cell * G.dpr;
    const ctx = s.getContext('2d');
    ctx.scale(G.dpr, G.dpr);
    return [s, ctx];
  }

  // Glossy rounded-square candy tile in the pattern's hue.
  static _bakeTile(pattern) {
    RenderView._stats.tiles++;
    const color = PATTERN_COLORS[(pattern - 1) % PATTERN_COLORS.length];
    const [s, ctx] = RenderView._tileCanvas();
    const S = G.cell;
    const m = S * 0.04;                 // margin for the drop shadow
    const w = S - m * 2;
    const r = w * 0.30;

    ctx.save();
    ctx.shadowColor = 'rgba(4,16,30,0.45)';
    ctx.shadowBlur = S * 0.08;
    ctx.shadowOffsetY = S * 0.045;
    const grad = ctx.createLinearGradient(0, m, 0, m + w);
    grad.addColorStop(0, shade(color, 42));
    grad.addColorStop(1, shade(color, -26));
    ctx.fillStyle = grad;
    ctx.beginPath(); roundRectPath(ctx, m, m, w, w, r); ctx.fill();
    ctx.restore();

    // inner bevel: light top edge
    ctx.save();
    ctx.beginPath(); roundRectPath(ctx, m + 1.5, m + 1.5, w - 3, w - 3, r - 1.5);
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = Math.max(1.5, S * 0.03);
    ctx.stroke();
    ctx.beginPath(); roundRectPath(ctx, m + 3, m + 3, w - 6, w - 6, r - 3);
    ctx.strokeStyle = 'rgba(8,20,36,0.18)';
    ctx.lineWidth = Math.max(1, S * 0.02);
    ctx.stroke();
    ctx.restore();

    // gloss
    ctx.save();
    ctx.beginPath();
    roundRectPath(ctx, m + w * 0.10, m + w * 0.06, w * 0.80, w * 0.34, w * 0.17);
    ctx.clip();
    const gl = ctx.createLinearGradient(0, m, 0, m + w * 0.45);
    gl.addColorStop(0, 'rgba(255,255,255,0.42)');
    gl.addColorStop(1, 'rgba(255,255,255,0.05)');
    ctx.fillStyle = gl;
    ctx.fillRect(m, m, w, w * 0.5);
    ctx.restore();

    return s;
  }

  // Rasterize the SVG creature onto a copy of the tile; swap it into the
  // cache entry once loaded and notify the view for a repaint.
  static _bakeCreature(pattern, key, entry) {
    RenderView._stats.creatures++;
    const img = new Image();
    img.onload = () => {
      const [s, ctx] = RenderView._tileCanvas();
      ctx.drawImage(entry.base, 0, 0, G.cell, G.cell);
      const inset = G.cell * 0.14;
      ctx.drawImage(img, inset, inset, G.cell - inset * 2, G.cell - inset * 2);
      entry.final = s;
      if (RenderView.onChange) RenderView.onChange();
    };
    img.onerror = () => {
      // keep the plain tile; log once in debug mode
      dbg({ type: 'spriteLoadError', pattern });
    };
    img.src = svgDataUri(creatureSvg(pattern));
  }

  constructor(canvas, core) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.core = core;
    this.dpr = window.devicePixelRatio || 1;
    this.bg = null;
    this.drag = null;   // { group, dir, offsetPx, maxDist }
    this.revert = null; // { group, dir, offsetPx, fromPx }
    this.elimFlash = null; // { t0, dur, pairs, removedIds }
    this.hint = null;      // { blockId, dir, target }
    this.pick = null;      // { r, c, targets: [{r,c,dir},...] } multi-choice overlay
    this.bounce = null;    // { pattern, t0, dur } bounce animation for same-pattern blocks
    this.onRevert = null;  // called when a drag ends without a match
    this.hoverCell = null; // { r, c } under mouse (debug mode only)
    this.particles = [];   // match burst particles
    this.rings = [];       // shockwave rings
    this.bubbles = null;   // ambient drifting bubbles (lazy init)
    this._lastT = performance.now();
    this.spawnT0 = performance.now(); // board entrance stagger origin
    this._animToken = 0;
    this.resize();
    this._buildBackground();
    this.render();
    this.startLoop();
  }

  // Continuous frame loop: drives particles, ambient bubbles and any timed
  // effect without per-animation bookkeeping. Battery/perf friendly:
  //  - skips entirely when the tab is hidden or a modal overlay froze the view
  //  - drops to ~30fps when idle (only ambient bubbles animate), back to
  //    full 60fps while dragging, effects, hints or the pick overlay are live
  startLoop() {
    if (RenderView._looping) return;
    let lastRender = 0;
    const step = (tms) => {
      RenderView._raf = requestAnimationFrame(step);
      const view = RenderView._active;
      if (!view || document.hidden || RenderView._paused) return;
      view._updateEffects(performance.now());
      // rolling frame-time sample for the debug overlay
      const t = performance.now();
      if (lastRender > 0) {
        const dt = t - lastRender;
        const s = RenderView._stats;
        s.frames++;
        s.dtSum += dt;
        if (s.frames % 60 === 0) {
          s.fps = Math.round(1000 / Math.max(0.01, s.dtSum / 60));
          s.dtSum = 0;
        }
      }
      if (view.isBusyFrame() || t - lastRender >= 33) {
        view.render();
        lastRender = t;
      }
    };
    RenderView._looping = true;
    RenderView._active = this;
    RenderView._raf = requestAnimationFrame(step);
  }

  // True while anything demands full-rate rendering.
  isBusyFrame() {
    return !!(this.drag || this.revert || this.pick || this.bounce ||
              this.hint || this.elimFlash ||
              this.particles.length > 0 || this.rings.length > 0);
  }

  // Freeze/unfreeze the whole frame loop (modal overlays, win screen).
  static setPaused(p) { RenderView._paused = p; }

  static setActiveView(view) {
    RenderView._active = view;
  }

  _initBubbles() {
    this.bubbles = [];
    const n = Math.max(8, Math.round(G.size / 48));
    for (let i = 0; i < n; i++) {
      this.bubbles.push({
        x: Math.random() * G.size,
        y: Math.random() * G.size,
        r: G.cell * (0.035 + Math.random() * 0.045),
        sp: G.cell * (0.12 + Math.random() * 0.28),
        ph: Math.random() * Math.PI * 2,
        a: 0.07 + Math.random() * 0.11,
      });
    }
  }

  _updateEffects(now) {
    const dt = Math.min(0.05, (now - this._lastT) / 1000);
    this._lastT = now;
    // ambient bubbles rise with a gentle sway (skipped for reduced motion)
    if (!REDUCED_MOTION) {
      if (!this.bubbles) this._initBubbles();
      for (const b of this.bubbles) {
        b.y -= b.sp * dt;
        b.x += Math.sin(now * 0.0011 + b.ph) * 12 * dt;
        if (b.y < -b.r * 2) { b.y = G.size + b.r * 2; b.x = Math.random() * G.size; }
      }
    } else if (this.bubbles && this.bubbles.length) {
      this.bubbles.length = 0;
    }
    // match particles: slight buoyancy then fade
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.t += dt;
      if (p.t >= p.life) { this.particles.splice(i, 1); continue; }
      p.vy += 90 * dt;
      p.vx *= (1 - 1.4 * dt);
      p.x += p.vx * dt;
      p.y += p.vy * dt;
    }
    for (let i = this.rings.length - 1; i >= 0; i--) {
      const g = this.rings[i];
      g.t += dt;
      if (g.t >= g.dur) this.rings.splice(i, 1);
    }
  }

  // Recompute geometry from the current viewport and repaint. Sprites are
  // cached per (pattern, cell, dpr) so they rebake automatically.
  relayout() {
    const wasSize = G.size;
    this.resize();
    if (G.size !== wasSize || this.bg.width !== G.size * G.dpr) this._buildBackground();
    this.render();
  }

  resize() {
    computeLayout();
    const dpr = Math.min(window.devicePixelRatio || 1, DPR_CAP);
    const bw = Math.round(G.size * dpr);
    // Guard the backing store: assigning canvas.width reallocates the whole
    // buffer in Chrome, so skip when nothing actually changed (this is what
    // makes viewport jitter cheap instead of a re-allocation storm).
    if (this.canvas.width === bw && this.canvas.height === bw && G.dpr === dpr &&
        this.canvas.style.width === G.size + 'px') {
      return;
    }
    G.dpr = dpr;
    this.canvas.width = bw;
    this.canvas.height = bw;
    this.canvas.style.width = G.size + 'px';
    this.canvas.style.height = G.size + 'px';
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  // Deep-sea scene baked once per geometry change: gradient water column,
  // light shafts, caustic glows, rounded cell tiles and an edge vignette.
  _buildBackground() {
    if (RenderView._stats) RenderView._stats.bgs++;
    const bg = document.createElement('canvas');
    bg.width = G.size * this.dpr;
    bg.height = G.size * this.dpr;
    const ctx = bg.getContext('2d');
    ctx.scale(this.dpr, this.dpr);
    const S = G.size;

    // water column
    const water = ctx.createLinearGradient(0, 0, S * 0.25, S);
    water.addColorStop(0, '#155073');
    water.addColorStop(0.5, '#0d3556');
    water.addColorStop(1, '#081f38');
    ctx.fillStyle = water;
    ctx.fillRect(0, 0, S, S);

    // caustic glow blobs
    const blobs = [
      [0.22, 0.16, 0.30], [0.78, 0.30, 0.26], [0.30, 0.72, 0.32],
      [0.82, 0.82, 0.24], [0.55, 0.50, 0.36],
    ];
    for (const [fx, fy, fr] of blobs) {
      const g = ctx.createRadialGradient(fx * S, fy * S, 0, fx * S, fy * S, fr * S);
      g.addColorStop(0, 'rgba(80,200,255,0.10)');
      g.addColorStop(1, 'rgba(80,200,255,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, S, S);
    }

    // god rays from the top edge
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const [x0, tilt, wRay] of [[0.18, -0.16, 0.16], [0.45, 0.05, 0.12], [0.74, 0.20, 0.18]]) {
      const gx = ctx.createLinearGradient(0, 0, 0, S * 0.95);
      gx.addColorStop(0, 'rgba(190,240,255,0.14)');
      gx.addColorStop(1, 'rgba(190,240,255,0)');
      ctx.fillStyle = gx;
      ctx.beginPath();
      const bx = x0 * S, dx = tilt * S;
      ctx.moveTo(bx - wRay * S * 0.2, 0);
      ctx.lineTo(bx + wRay * S * 0.2, 0);
      ctx.lineTo(bx + wRay * S + dx, S);
      ctx.lineTo(bx - wRay * S + dx, S);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();

    // warm sand glow at the bottom
    const sand = ctx.createRadialGradient(S / 2, S * 1.06, 0, S / 2, S * 1.06, S * 0.62);
    sand.addColorStop(0, 'rgba(255,214,140,0.13)');
    sand.addColorStop(1, 'rgba(255,214,140,0)');
    ctx.fillStyle = sand;
    ctx.fillRect(0, 0, S, S);

    // cell tiles
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const x = c * G.pitch, y = r * G.pitch;
        ctx.save();
        ctx.beginPath(); roundRectPath(ctx, x, y, G.cell, G.cell, G.cell * 0.22);
        ctx.fillStyle = 'rgba(255,255,255,0.055)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.07)';
        ctx.lineWidth = 1;
        ctx.stroke();
        // top inner highlight
        ctx.beginPath(); roundRectPath(ctx, x + G.cell * 0.10, y + G.cell * 0.06, G.cell * 0.80, G.cell * 0.16, G.cell * 0.08);
        ctx.fillStyle = 'rgba(255,255,255,0.045)';
        ctx.fill();
        ctx.restore();
      }
    }

    // vignette
    const vig = ctx.createRadialGradient(S / 2, S / 2, S * 0.42, S / 2, S / 2, S * 0.75);
    vig.addColorStop(0, 'rgba(0,8,20,0)');
    vig.addColorStop(1, 'rgba(0,8,20,0.34)');
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, S, S);

    this.bg = bg;
  }

  gridToPixel(r, c) {
    return { x: c * G.pitch, y: r * G.pitch };
  }

  pixelToGrid(x, y) {
    const c = Math.floor(x / G.pitch);
    const r = Math.floor(y / G.pitch);
    return { r, c };
  }

  _groupOffsetPx() {
    if (this.drag) return this.drag.offsetPx;
    if (this.revert) return this.revert.offsetPx;
    return 0;
  }

  _groupDir() {
    if (this.drag) return this.drag.dir;
    if (this.revert) return this.revert.dir;
    return null;
  }

  render() {
    const ctx = this.ctx;
    const now = performance.now();
    ctx.clearRect(0, 0, G.size, G.size);
    ctx.drawImage(this.bg, 0, 0, G.size, G.size);

    // ambient bubbles drift behind the blocks
    if (this.bubbles) {
      for (const b of this.bubbles) {
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(190,235,255,${b.a})`;
        ctx.fill();
        ctx.beginPath();
        ctx.arc(b.x - b.r * 0.3, b.y - b.r * 0.3, b.r * 0.32, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,255,255,${b.a * 1.4})`;
        ctx.fill();
      }
    }

    // Drag axis highlight: while dragging, tint the row AND column of the
    // leading block (A) with a light-white mask so the player can see which
    // row/column is being attempted for a match. The mask follows the block's
    // live position: for a horizontal slide the row stays fixed and the column
    // tracks the block; for a vertical slide the column stays fixed and the
    // row tracks the block.
    const offsetPx = this._groupOffsetPx();
    const dir = this._groupDir();
    const moving = new Map();
    if (this.drag || this.revert) {
      const active = this.drag || this.revert;
      const d = GameCore.DIRS[dir];
      const px = d.dc * offsetPx;
      const py = d.dr * offsetPx;
      for (const m of active.group) {
        moving.set(m.id, { x: m.c * G.pitch + px, y: m.r * G.pitch + py });
      }
      if (this.drag) {
        // The cross mask ALWAYS centers on the dragged block, snapping to the
        // nearest grid cell the block's center currently occupies. As the
        // block slides into the next row/column, the mask's row/column snaps
        // to that cell (discrete, not smooth pointer tracking).
        const a = active.group[0];
        const cellPx = G.pitch;
        const dragDir = this.drag.dir;
        const d = GameCore.DIRS[dragDir];
        const offsetPx = this.drag.offsetPx;
        const cx = a.c * cellPx + G.cell / 2 + d.dc * offsetPx; // block center px
        const cy = a.r * cellPx + G.cell / 2 + d.dr * offsetPx;
        const curR = Math.floor(cy / cellPx);
        const curC = Math.floor(cx / cellPx);
        ctx.fillStyle = 'rgba(255,255,255,0.28)';
        ctx.fillRect(0, curR * cellPx, G.size, G.cell);
        ctx.fillRect(curC * cellPx, 0, G.cell, G.size);
      }
    }

    if (this.elimFlash) {
      const t = Math.min(1, (performance.now() - this.elimFlash.t0) / this.elimFlash.dur);
      ctx.strokeStyle = `rgba(255,213,79,${0.9 * (1 - t)})`;
      ctx.lineWidth = 5;
      for (const [ax, ay, bx, by] of this.elimFlash.pairs) {
        ctx.beginPath();
        ctx.moveTo(ax + G.cell / 2, ay + G.cell / 2);
        ctx.lineTo(bx + G.cell / 2, by + G.cell / 2);
        ctx.stroke();
      }
      // shrinking ghost of each removed tile sells the "pop"
      if (this.elimFlash.ghosts && this.elimFlash.pattern) {
        const spr = RenderView.spriteFor(this.elimFlash.pattern);
        const gs = 1 + 0.35 * t;
        ctx.globalAlpha = 0.95 * (1 - t);
        const w = G.cell * gs;
        for (const g of this.elimFlash.ghosts) {
          ctx.drawImage(spr, g.x + G.cell / 2 - w / 2, g.y + G.cell / 2 - w / 2, w, w);
        }
        ctx.globalAlpha = 1;
      }
    }

    // Pulse: same-pattern blocks gently scale in/out around their own center
    // on a decaying sine wave (no positional bounce).
    let pulseScale = 0;
    let pulsePattern = null;
    if (this.bounce) {
      const t = Math.min(1, (performance.now() - this.bounce.t0) / this.bounce.dur);
      if (t < 1) {
        pulsePattern = this.bounce.pattern;
        const amp = (1 - t) * 0.22;              // decaying scale amplitude
        pulseScale = Math.sin(t * Math.PI) * amp; // >0 enlarge, <0 shrink
      } else {
        this.bounce = null;
      }
    }

    const blocks = this.core.getBlocks();
    for (let idx = 0; idx < blocks.length; idx++) {
      const block = blocks[idx];
      const pos = moving.get(block.id);
      const x = pos ? pos.x : block.c * G.pitch;
      const y = pos ? pos.y : block.r * G.pitch;
      let scale = 1;
      if (pulsePattern !== null && block.pattern === pulsePattern) scale += pulseScale;
      // entrance pop on a fresh board (staggered by board order)
      if (!REDUCED_MOTION) {
        const lt = (now - this.spawnT0 - Math.min(idx * 9, 420)) / 240;
        if (lt < 0) scale *= 0.0001;
        else if (lt < 1) {
          const c1 = 1.70158, c3 = c1 + 1, u = lt - 1;
          scale *= 1 + c3 * u * u * u + c1 * u * u; // ease-out-back
        }
      }
      this.drawBlock(block, x, y, scale);
    }

    if (this.hint) {
      const b = this.core.getBlocks().find(x => x.id === this.hint.blockId);
      const target = this.hint.target;
      if (b) {
        const pulse = 0.65 + 0.35 * Math.sin(now * 0.006);
        ctx.save();
        ctx.globalAlpha = pulse;
        ctx.strokeStyle = '#ffd54f';
        ctx.lineWidth = 4;
        ctx.setLineDash([9, 7]);
        ctx.lineDashOffset = -(now * 0.03) % 16;
        const p = this.gridToPixel(b.r, b.c);
        ctx.strokeRect(p.x + 2, p.y + 2, G.cell - 4, G.cell - 4);
        const tp = this.gridToPixel(target.r, target.c);
        ctx.beginPath();
        ctx.moveTo(p.x + G.cell / 2, p.y + G.cell / 2);
        ctx.lineTo(tp.x + G.cell / 2, tp.y + G.cell / 2);
        ctx.stroke();
        ctx.strokeRect(tp.x + 2, tp.y + 2, G.cell - 4, G.cell - 4);
        ctx.restore();
      }
    }

    if (this.pick) {
      // Dark translucent mask over the whole board; every selectable B target
      // stays bright and is redrawn on top so they are not obscured.
      ctx.fillStyle = 'rgba(0,0,0,0.62)';
      ctx.fillRect(0, 0, G.size, G.size);
      // pulsing ring around the dragged block A
      const pa = this.gridToPixel(this.pick.r, this.pick.c);
      const ringR = G.cell * (0.55 + 0.05 * Math.sin(now * 0.008));
      ctx.beginPath();
      ctx.arc(pa.x + G.cell / 2, pa.y + G.cell / 2, ringR, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255,213,79,0.9)';
      ctx.lineWidth = 3;
      ctx.stroke();
      let ti = 0;
      for (const t of this.pick.targets) {
        if (!t) continue;
        ti++;
        const p = this.gridToPixel(t.r, t.c);
        const ts = 1 + (REDUCED_MOTION ? 0 : 0.06 * Math.sin(now * 0.008 + ti * 0.9));
        ctx.save();
        ctx.shadowColor = 'rgba(255,255,255,0.9)';
        ctx.shadowBlur = 14;
        this.drawBlock(this.core.getBlocks().find(b => b.r === t.r && b.c === t.c) || { pattern: this.core.getGrid()[t.r][t.c], r: t.r, c: t.c }, p.x, p.y, ts);
        ctx.restore();
        ctx.strokeStyle = '#ffd54f';
        ctx.lineWidth = 4;
        ctx.strokeRect(p.x + 2, p.y + 2, G.cell - 4, G.cell - 4);
      }
    }
    // shockwave rings + particles on top of everything
    for (const g of this.rings) {
      const t = g.t / g.dur;
      ctx.beginPath();
      ctx.arc(g.x, g.y, g.maxR * (0.2 + 0.8 * t), 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(255,255,255,${(0.5 * (1 - t)).toFixed(3)})`;
      ctx.lineWidth = Math.max(1.5, G.cell * 0.06 * (1 - t));
      ctx.stroke();
    }
    for (const p of this.particles) {
      const t = p.t / p.life;
      const r = p.r * (1 - 0.55 * t);
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, Math.max(r, 0.1));
      g.addColorStop(0, 'rgba(255,255,255,' + (0.9 * (1 - t)).toFixed(3) + ')');
      g.addColorStop(0.6, this._hexA(p.color, (0.75 * (1 - t)).toFixed(3)));
      g.addColorStop(1, this._hexA(p.color, '0'));
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
      ctx.fill();
    }

    if (DEBUG_ENABLED) this._renderDebugOverlay();
  }

  _renderDebugOverlay() {
    const ctx = this.ctx;
    // perf line: fps + bake counters (bakes must stay flat while playing)
    const s = RenderView._stats || {};
    ctx.save();
    ctx.font = '11px monospace';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fillRect(4, 4, 210, 16);
    ctx.fillStyle = '#9fe8ff';
    ctx.fillText(`fps:${s.fps || '-'} tiles:${s.tiles} svg:${s.creatures} bg:${s.bgs}`, 8, 7);
    ctx.restore();

    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.lineWidth = 1;
    ctx.font = '10px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const p = this.gridToPixel(r, c);
        ctx.strokeRect(p.x + 1, p.y + 1, G.cell - 2, G.cell - 2);
        const v = this.core.getGrid()[r][c];
        ctx.fillText(v === 0 ? '·' : String(v), p.x + G.cell / 2, p.y + G.cell / 2);
      }
    }
    if (this.hoverCell) {
      const { r, c } = this.hoverCell;
      const p = this.gridToPixel(r, c);
      ctx.strokeStyle = '#ffd54f';
      ctx.lineWidth = 3;
      ctx.strokeRect(p.x + 1, p.y + 1, G.cell - 2, G.cell - 2);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 14px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(`(${r},${c})`, p.x + G.cell / 2, p.y - 8);
    }
  }

  _hexA(hex, a) {
    const n = parseInt(hex.slice(1), 16);
    return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`;
  }

  drawBlock(block, x, y, scale = 1) {
    if (scale === 1) {
      this.ctx.drawImage(RenderView.spriteFor(block.pattern), x, y, G.cell, G.cell);
      return;
    }
    // Scale around the block's own center.
    const cx = x + G.cell / 2, cy = y + G.cell / 2;
    const w = G.cell * scale, h = G.cell * scale;
    this.ctx.drawImage(RenderView.spriteFor(block.pattern), cx - w / 2, cy - h / 2, w, h);
  }

  // Trigger a pulse (scale in/out around each block's center) for every block
  // matching `pattern`. Used when the player taps a block and no match occurs,
  // so all same-type blocks visibly react.
  triggerBounce(pattern) {
    this.bounce = { pattern, t0: performance.now(), dur: 450 };
    this._animateUntil(450, () => this.render(), () => {
      this.bounce = null;
      this.render();
    });
  }

  // Spawn a bubble burst + shockwave ring at a grid cell. Called for both
  // halves of an eliminated pair; power scales with the combo streak.
  matchBurst(r, c, pattern, power = 1) {
    if (REDUCED_MOTION) return;
    const cx = c * G.pitch + G.cell / 2;
    const cy = r * G.pitch + G.cell / 2;
    const base = PATTERN_COLORS[(pattern - 1) % PATTERN_COLORS.length];
    const palette = ['#ffffff', '#cfefff', shade(base, 70), base];
    const n = Math.round(10 + 6 * Math.min(power, 3));
    for (let i = 0; i < n; i++) {
      const ang = Math.random() * Math.PI * 2;
      const sp = (60 + Math.random() * 150) * (G.cell / 64) * (1 + 0.22 * Math.min(power, 3));
      this.particles.push({
        x: cx + (Math.random() - 0.5) * G.cell * 0.4,
        y: cy + (Math.random() - 0.5) * G.cell * 0.4,
        vx: Math.cos(ang) * sp,
        vy: Math.sin(ang) * sp - 50 * (G.cell / 64),
        r: G.cell * (0.05 + Math.random() * 0.085),
        t: 0,
        life: 0.45 + Math.random() * 0.45,
        color: palette[Math.floor(Math.random() * palette.length)],
      });
    }
    this.rings.push({ x: cx, y: cy, t: 0, dur: 0.38, maxR: G.cell * (0.85 + 0.15 * Math.min(power, 3)), color: base });
  }

  startDrag(group, dir, maxDist) {
    this.drag = { group, dir, offsetPx: 0, maxDist };
    this.revert = null;
    this.elimFlash = null;
    this._bumpToken();
    this.render();
  }

  updateDrag(offsetPx) {
    if (!this.drag) return;
    const cellPx = G.pitch;
    const maxPx = this.drag.maxDist * cellPx;
    this.drag.offsetPx = Math.max(0, Math.min(maxPx, offsetPx));
    this.render();
  }

  snapAndResolve(onDone) {
    if (!this.drag) { onDone && onDone(); return; }
    const cellPx = G.pitch;
    // Support discrete-point sliding: snap to the cell the user released on
    // (clamped to 1..maxDist), then resolve THAT distance. If it matches,
    // eliminate; otherwise revert back to origin. The user can stop at an
    // intermediate cell instead of always sliding to the max distance.
    const rawDist = Math.round(this.drag.offsetPx / cellPx);
    const dist = Math.min(this.drag.maxDist, rawDist);
    // If the block did not reach the center of the next cell (rounded to 0),
    // it should NOT snap to that cell first: revert straight back to origin.
    if (dist === 0) {
      const { group, dir } = this.drag;
      const from = this.drag.offsetPx;
      this.drag = null;
      this.revert = { group, dir, offsetPx: from, fromPx: from };
      this._animate(from, 0, 220, (v) => {
        this.revert.offsetPx = v;
        this.render();
      }, () => {
        this.revert = null;
        this.render();
        onDone && onDone();
      });
      return;
    }
    const to = dist * cellPx;
    const from = this.drag.offsetPx;
    this._animate(from, to, 120, (v) => {
      this.drag.offsetPx = v;
      this.render();
    }, () => {
      const { group, dir } = this.drag;
      const d = GameCore.DIRS[dir];
      const a = group[0];
      const aR = a.r + d.dr * dist, aC = a.c + d.dc * dist;
      dbgStep();
      dbg({ type: 'snapResolve', dir, dist, maxDist: this.drag.maxDist, gridBefore: this.core.getGrid().map(r => r.join('')) });
      // Before resolving, check whether A's final position can match BOTH
      // horizontally and vertically. If so, surface the multi-choice overlay
      // instead of resolving immediately.
      const vacated = new Set();
      const occupied = new Map();
      for (const m of group) {
        vacated.add(m.r + "," + m.c);
        occupied.set((m.r + d.dr * dist) + "," + (m.c + d.dc * dist), this.core.getGrid()[m.r][m.c]);
      }
      const multi = this.core.findMultiMatches(aR, aC, { vacated, occupied });
      if (multi) {
        // Multi-choice: commit the slide so A really occupies its final cell,
        // then surface the overlay. Picking a B target resolves A+B in place;
        // cancelling reverts the slide back to the origin. Snapshot BEFORE the
        // slide so an undo restores the dragged block to its ORIGINAL cell.
        this.core.pushSnapshot();
        const slideMoved = this.core.applySlide(group, dir, dist);
        this.pick = {
          r: aR, c: aC,
          targets: multi,
          slide: { group, dir, dist, moved: slideMoved },
        };
        this.drag = null;
        dbg({ type: 'pickOpen', r: aR, c: aC, multi });
        this.render();
        if (onDone) onDone();
        return;
      }
      this.drag = null;
      const res = this.core.resolve({ group, dir, dist });
      if (res.match) {
        const a = group[0];
        const ax = (a.c + d.dc * dist) * cellPx;
        const ay = (a.r + d.dr * dist) * cellPx;
        const tp = this.gridToPixel(res.target.r, res.target.c);
        if (this.onMatchFx) {
          this.onMatchFx({
            cells: [{ r: a.r + d.dr * dist, c: a.c + d.dc * dist }, { ...res.target }],
            pattern: group[0].pattern,
          });
        }
        this.elimFlash = {
          t0: performance.now(),
          dur: 350,
          pairs: [[ax, ay, tp.x, tp.y]],
          removedIds: res.removedIds,
          ghosts: [{ x: ax, y: ay }, { x: tp.x, y: tp.y }],
          pattern: group[0].pattern,
        };
        this._animateUntil(this.elimFlash.dur, () => this.render(), () => {
          this.elimFlash = null;
          this.render();
          onDone && onDone();
        });
      } else {
        if (this.onRevert) this.onRevert(); // drag ended with no match -> revert sound
        this.revert = { group, dir, offsetPx: to, fromPx: to };
        this._animate(to, 0, 220, (v) => {
          this.revert.offsetPx = v;
          this.render();
        }, () => {
          this.revert = null;
          this.render();
          onDone && onDone();
        });
      }
    });
  }

  _animate(from, to, dur, tick, onDone) {
    const token = ++this._animToken;
    const t0 = performance.now();
    const step = (now) => {
      if (token !== this._animToken) return; // cancelled
      const t = Math.min(1, (now - t0) / dur);
      const e = 1 - (1 - t) * (1 - t); // ease-out
      tick(from + (to - from) * e);
      if (t < 1) {
        requestAnimationFrame(step);
      } else {
        onDone && onDone();
      }
    };
    requestAnimationFrame(step);
  }

  _animateUntil(dur, tick, onDone) {
    const token = ++this._animToken;
    const t0 = performance.now();
    const step = (now) => {
      if (token !== this._animToken) return;
      const t = Math.min(1, (now - t0) / dur);
      tick(t);
      if (t < 1) requestAnimationFrame(step);
      else onDone && onDone();
    };
    requestAnimationFrame(step);
  }

  _bumpToken() { this._animToken++; }
}

window.runSelfTest = runSelfTest;

// ================= SOUND (Web Audio synth, no assets) =================
// All SFX are synthesized. A persistent master gain implements mute, and the
// preference is stored in localStorage. Match chimes climb a pentatonic scale
// with the combo streak so long chains feel rewarding.
class SoundManager {
  constructor() {
    this.ctx = null;
    this.master = null;
    this.enabled = SoundManager.loadPref();
  }

  static loadPref() {
    try { return localStorage.getItem('psm.sound') !== 'off'; } catch (e) { return true; }
  }

  setEnabled(on) {
    this.enabled = on;
    try { localStorage.setItem('psm.sound', on ? 'on' : 'off'); } catch (e) {}
    if (this.master && this.ctx) {
      this.master.gain.setTargetAtTime(on ? 0.5 : 0.0001, this.ctx.currentTime, 0.02);
    }
    if (on) this._initOnFirstUse();
  }

  _initOnFirstUse() {
    // AudioContext must be created/resumed after a user gesture in most browsers.
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.enabled ? 0.5 : 0.0001;
      this.master.connect(this.ctx.destination);
    } catch (e) { this.ctx = null; }
  }

  // Short tone with pluck envelope, routed through the master gain.
  _tone(freq, dur, type, vol, when = 0, slideTo = null) {
    if (!this.enabled || !this.ctx) return;
    const t0 = this.ctx.currentTime + when;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain).connect(this.master);
    osc.start(t0);
    osc.stop(t0 + dur + 0.03);
  }

  _noise(dur, vol, fFrom, fTo, when = 0) {
    if (!this.enabled || !this.ctx) return;
    const t0 = this.ctx.currentTime + when;
    const len = Math.max(1, Math.floor(this.ctx.sampleRate * dur));
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    const bp = this.ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.Q.value = 1.1;
    bp.frequency.setValueAtTime(fFrom, t0);
    bp.frequency.exponentialRampToValueAtTime(fTo, t0 + dur);
    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(vol, t0);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(bp).connect(gain).connect(this.master);
    src.start(t0);
  }

  // Combo pitch ladder: a C-major-pentatonic climb over two octaves, then
  // ping-ponging back down WITHOUT repeating the end notes. Consecutive
  // combos therefore always change pitch - forever - while staying inside a
  // pleasant 523..1760 Hz band no matter how long the streak runs.
  static COMBO_LADDER = (() => {
    const penta = [0, 2, 4, 7, 9]; // major pentatonic semitones
    const up = [];
    for (let oct = 0; oct < 2; oct++) {
      for (const d of penta) up.push(12 * oct + d);
    }
    const seq = up.concat(up.slice(1, -1).reverse());
    return seq.map((s) => 523.25 * Math.pow(2, s / 12));
  })();

  static noteForCombo(combo) {
    const i = Math.max(1, Math.floor(combo || 1)) - 1;
    return SoundManager.COMBO_LADDER[i % SoundManager.COMBO_LADDER.length];
  }

  match(combo = 1) {
    this._initOnFirstUse();
    const f = SoundManager.noteForCombo(combo);
    this._tone(f, 0.14, 'triangle', 0.34);
    this._tone(f * 2, 0.10, 'sine', 0.12, 0.02);
    this._noise(0.08, 0.05, 5000, 9000); // sparkle
  }

  release() {
    this._initOnFirstUse();
    this._tone(420, 0.13, 'sine', 0.16, 0, 270);
  }

  click() {
    this._initOnFirstUse();
    this._tone(320, 0.06, 'triangle', 0.14);
  }

  pick() {
    this._initOnFirstUse();
    this._tone(700, 0.07, 'triangle', 0.22);
  }

  ui() {
    this._initOnFirstUse();
    this._tone(820, 0.04, 'square', 0.06);
  }

  shuffleSfx() {
    this._initOnFirstUse();
    this._noise(0.28, 0.18, 300, 2400);
    this._tone(220, 0.18, 'sine', 0.10, 0.02, 330);
  }

  win() {
    this._initOnFirstUse();
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
      this._tone(f, 0.22, 'triangle', 0.30, i * 0.11);
      this._tone(f * 2, 0.16, 'sine', 0.10, i * 0.11 + 0.03);
    });
    this._noise(0.5, 0.06, 6000, 11000, 0.33);
  }
}

window.SoundManager = SoundManager; // testable combo ladder

// ================= INPUT CONTROLLER + APP =================
class App {
  constructor() {
    this.core = new GameCore();
    this.canvas = document.getElementById('board');
    this.view = new RenderView(this.canvas, this.core);
    this.streak = 0;
    this.stats = this._freshStats();
    this._wireView(this.view);
    this.busy = false;
    this.press = null; // { r, c, startX, startY, dir, group, maxDist }
    this.picking = null; // { r, c, horizontal: {r,c}, vertical: {r,c} } multi-choice active
    this.sound = new SoundManager();
    this._bindControls();
    this._bindInput();
    this._bindViewport();
    this.updateHud();
    this._maybeCoach();
  }

  // Keep the board fitted to the viewport across rotation, browser chrome
  // show/hide and window resizing. Two guards prevent the classic mobile
  // feedback storm (URL bar toggles -> canvas resize -> layout shift -> URL
  // bar toggles...): a trailing debounce plus a hysteresis threshold, and
  // resize() itself is a no-op when dimensions did not change.
  _bindViewport() {
    let timer = null;
    const apply = () => {
      timer = null;
      const wrap = document.getElementById('boardWrap');
      if (!wrap) return;
      this.maybeRelayout(wrap.clientWidth, wrap.clientHeight);
    };
    const onResize = () => {
      if (timer) clearTimeout(timer);
      timer = setTimeout(apply, 120);
    };
    window.addEventListener('resize', onResize);
    window.addEventListener('orientationchange', onResize);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', onResize);
    // Suppress the long-press context menu on the board (mobile) and any
    // residual double-tap zoom (iOS sometimes ignores user-scalable=no).
    this.canvas.addEventListener('contextmenu', (e) => e.preventDefault());
    document.addEventListener('dblclick', (e) => e.preventDefault());
    // In debug mode, capture uncaught errors into the structured log buffer.
    if (DEBUG_ENABLED) {
      window.addEventListener('error', (ev) => {
        dbg({ type: 'windowError', msg: String(ev.message), line: ev.lineno, col: ev.colno });
      });
      window.addEventListener('unhandledrejection', (ev) => {
        dbg({ type: 'unhandledRejection', reason: String(ev.reason) });
      });
    }
  }

  // Relayout only when the available box changed meaningfully (<24px deltas
  // are browser-chrome jitter, e.g. the URL bar sliding away).
  maybeRelayout(w, h) {
    if (this._vpW > 0 && Math.abs(w - this._vpW) < 24 && Math.abs(h - this._vpH) < 24) return;
    this._vpW = w;
    this._vpH = h;
    this.view.relayout();
  }

  // Attach per-view callbacks. Called when the view is created or rebuilt
  // (restart) so effects/sounds keep working against the fresh instance.
  _wireView(view) {
    RenderView.onChange = () => { if (this.view) this.view.render(); }; // async SVG sprites
    RenderView.setActiveView(view); // keep the frame loop on the fresh view
    view.onRevert = () => {
      if (this.sound) this.sound.release();
      this.streak = 0; // failed drag breaks the chain
    };
    // Drag-elimination FX: view reports geometry, App owns feedback policy.
    view.onMatchFx = (fx) => { this._registerMatch(fx.cells, fx.pattern); };
  }

  // Unified successful-elimination hook: streak tracking, sound, haptics,
  // particle bursts and combo toast. Cells are the removed grid coords.
  _registerMatch(cells, pattern) {
    this.streak = (this.streak || 0) + 1;
    this.stats.moves++;
    this.sound.match(this.streak);
    this.vibrate(14);
    const power = Math.min(this.streak, 3);
    for (const cell of cells) this.view.matchBurst(cell.r, cell.c, pattern, power);
    if (this.streak >= 2) this.setMsg(`连击 ×${this.streak}`, 950);
  }

  vibrate(msOrPattern) {
    try { if (navigator.vibrate) navigator.vibrate(msOrPattern); } catch (e) {}
  }

  _freshStats() {
    return { t0: performance.now(), moves: 0, hints: 0, undos: 0 };
  }

  _bindControls() {
    document.getElementById('btnShuffle').addEventListener('click', () => {
      if (this.busy || this.core.getPatternCount() === 0) return;
      const btnShuffle = document.getElementById('btnShuffle');
      this.busy = true;
      dbgStep();
      dbg({ type: 'shuffle', gridBefore: this.core.getGrid().map(r => r.join('')) });
      this.core.shuffle();
      this.view.hint = null;
      this.view.drag = null;
      this.streak = 0;
      this.sound.ui();
      this.sound.shuffleSfx();
      this.vibrate(20);
      btnShuffle.classList.remove('attention');
      this.view.render();
      this.updateHud();
      this.busy = false;
    });
    document.getElementById('btnHint').addEventListener('click', () => {
      if (this.busy) return;
      this.sound.ui();
      this.stats.hints++;
      const h = this.core.findHint();
      if (h) {
        this.view.hint = h;
        this.view.render();
        const hinted = this.core.getBlocks().find((b) => b.id === h.blockId);
        const species = hinted ? PATTERN_NAMES[hinted.pattern - 1] : '';
        this.setMsg(species ? `提示：推动${species}即可消除` : '提示：推动该方块即可消除');
      } else {
        this.view.hint = null;
        this.view.render();
        this.setMsg('当前无解，可尝试洗牌');
      }
    });
    document.getElementById('btnUndo').addEventListener('click', () => {
      if (this.busy) return;
      this.sound.ui();
      this.undo();
    });
    document.getElementById('btnRestart').addEventListener('click', () => {
      this.sound.ui();
      this.restart();
    });
    document.getElementById('winRestart').addEventListener('click', () => {
      this.sound.ui();
      this.restart();
    });
    const btnSound = document.getElementById('btnSound');
    const paintSoundBtn = () => {
      btnSound.setAttribute('aria-pressed', String(!this.sound.enabled));
      btnSound.classList.toggle('muted', !this.sound.enabled);
    };
    btnSound.addEventListener('click', () => {
      this.sound.setEnabled(!this.sound.enabled);
      paintSoundBtn();
      if (this.sound.enabled) { this.sound.ui(); }
      this.setMsg(this.sound.enabled ? '声音已开启' : '声音已关闭', 1400);
    });
    paintSoundBtn();
  }

  // First-visit coaching overlay, persisted in localStorage.
  _maybeCoach() {
    let coached = false;
    try { coached = localStorage.getItem('psm.coached') === '1'; } catch (e) {}
    if (coached) return;
    const el = document.getElementById('coach');
    el.classList.remove('hidden');
    RenderView.setPaused(true); // freeze the canvas behind the modal
    const dismiss = () => {
      el.classList.add('hidden');
      RenderView.setPaused(false);
      try { localStorage.setItem('psm.coached', '1'); } catch (e) {}
      this.sound.ui();
    };
    document.getElementById('coachStart').addEventListener('click', dismiss);
  }

  _bindInput() {
    const DRAG_THRESHOLD = 6; // px before the axis direction is locked
    this.canvas.addEventListener('pointermove', (e) => {
      if (DEBUG_ENABLED && !this.busy && !this.press) {
        const pos = this._eventPos(e);
        const { r, c } = this.view.pixelToGrid(pos.x, pos.y);
        if (this.core.inBounds(r, c)) {
          this.view.hoverCell = { r, c };
          this.view.render();
        }
      }
    });
    this.canvas.addEventListener('pointerleave', () => {
      if (this.view.hoverCell) {
        this.view.hoverCell = null;
        this.view.render();
      }
    });
    this.canvas.addEventListener('pointerdown', (e) => {
      if (this.busy) return;
      this.busy = true;
      this.canvas.setPointerCapture(e.pointerId);
      const pos = this._eventPos(e);
      const { r, c } = this.view.pixelToGrid(pos.x, pos.y);
      this.view.hint = null;
      dbg({ type: 'pointerdown', r, c, gridVal: this.core.inBounds(r, c) ? this.core.getGrid()[r][c] : -1 });
      if (this.picking) {
        // Multi-choice overlay is active: clicking one of the highlighted B
        // targets resolves that pair; clicking anything else cancels.
        this.busy = false;
        const t = (this.picking.targets || []).find(x => x.r === r && x.c === c) || null;
        if (t) {
          this._doPick(this.picking.r, this.picking.c, t.r, t.c);
        } else {
          this._cancelPick();
        }
        return;
      }
      if (!this.core.inBounds(r, c) || this.core.getGrid()[r][c] === 0) {
        this.press = null;
        return; // busy stays true until pointerup releases it
      }
      // No sound on pointerdown: it is played on release only if no match
      // occurred (see endDrag). The same-pattern hop is also on-release-only.
      this.press = { r, c, startX: pos.x, startY: pos.y, axis: null, dir: null, group: null, maxDist: 0 };
    });
    this.canvas.addEventListener('pointermove', (e) => {
      if (!this.press || !this.busy) return;
      const pos = this._eventPos(e);
      const dx = pos.x - this.press.startX;
      const dy = pos.y - this.press.startY;

      if (!this.press.axis) {
        if (Math.abs(dx) < DRAG_THRESHOLD && Math.abs(dy) < DRAG_THRESHOLD) return;
        const isH = Math.abs(dx) >= Math.abs(dy);
        const dir = isH ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
        const group = this.core.getPushGroup(this.press.r, this.press.c, dir);
        if (!group) return;
        const maxDist = this.core.getMaxSlideDistance(group, dir);
        if (maxDist === 0) return; // blocked at origin, no slide possible
        this.press.axis = isH ? 'h' : 'v';
        this.press.dir = dir;
        this.press.group = group;
        this.press.maxDist = maxDist;
        dbgStep();
        dbg({ type: 'dragStart', from: { r: this.press.r, c: this.press.c }, dir, maxDist,
              group: group.map(m => ({ id: m.id, p: m.pattern, r: m.r, c: m.c })) });
        this.view.startDrag(group, dir, maxDist);
      }

      // Bidirectional slide within the locked axis; the group stays fixed.
      const curDir = this.press.axis === 'h' ? (dx >= 0 ? 'right' : 'left') : (dy >= 0 ? 'down' : 'up');
      const pxDist = this.press.axis === 'h' ? Math.abs(dx) : Math.abs(dy);
      const maxDist = this.core.getMaxSlideDistance(this.press.group, curDir);
      if (curDir !== this.press.dir) {
        this.press.dir = curDir;
        this.press.maxDist = maxDist;
        if (this.view.drag) { this.view.drag.dir = curDir; this.view.drag.maxDist = maxDist; }
      }
      this.view.updateDrag(Math.min(pxDist, maxDist * G.pitch));
    });
    const endDrag = () => {
      if (!this.busy) return;
      const hadDrag = this.press && this.press.dir !== null;
      const clickRc = this.press ? { r: this.press.r, c: this.press.c } : null;
      this.press = null;
      if (!hadDrag) {
        // Short tap with no drag: if the tapped block can match both
        // horizontally and vertically, show the multi-choice overlay instead
        // of resolving; otherwise attempt tap-to-match elimination.
        if (clickRc) {
          dbgStep();
          const multi = this.core.findMultiMatches(clickRc.r, clickRc.c);
          if (multi) {
            this.core.pushSnapshot(); // snapshot before the pick so undo restores A to origin
            this.picking = { r: clickRc.r, c: clickRc.c, targets: multi };
            this.view.pick = this.picking;
            this.sound.pick();
            this.vibrate(8);
            this.view.render();
            this.busy = false;
            dbg({ type: 'pickOpen', r: clickRc.r, c: clickRc.c, multi });
            return;
          }
          const tappedPattern = this.core.inBounds(clickRc.r, clickRc.c) ? this.core.getGrid()[clickRc.r][clickRc.c] : 0;
          const res = this.core.clickResolve(clickRc.r, clickRc.c);
          if (res.matched) {
            const cellPx = G.pitch;
            const ax = clickRc.c * cellPx;
            const ay = clickRc.r * cellPx;
            const tp = this.view.gridToPixel(res.target.r, res.target.c);
            this._registerMatch([clickRc, { ...res.target }], tappedPattern);
            this.view.elimFlash = {
              t0: performance.now(),
              dur: 350,
              pairs: [[ax + G.cell / 2, ay + G.cell / 2, tp.x + G.cell / 2, tp.y + G.cell / 2]],
              removedIds: res.removedIds,
              ghosts: [{ x: ax, y: ay }, { x: tp.x, y: tp.y }],
              pattern: tappedPattern,
            };
            this.view.render();
            this.view._animateUntil(350, () => this.view.render(), () => {
              this.view.elimFlash = null;
              this.view.render();
              this._finishAction();
            });
          } else {
            // No match on tap (released without matching): play the click
            // sound and show the same-pattern pulse as feedback.
            this.streak = 0;
            this.sound.click();
            if (tappedPattern !== 0) this.view.triggerBounce(tappedPattern);
            this._finishAction();
          }
        } else {
          this.busy = false;
        }
        return;
      }
      dbg({ type: 'pointerup', hadDrag: true });
      this.view.snapAndResolve(() => {
        // If the drag surfaced a multi-choice overlay (view.pick was set),
        // sync the App picking state so subsequent taps are intercepted.
        if (this.view.pick) {
          this.picking = this.view.pick;
          this.busy = false;
          this.sound.pick();
          dbg({ type: 'resolveDone', picking: true });
          return;
        }
        dbg({ type: 'resolveDone', gridRows: this.core.getGrid().map(r => r.join('')) });
        this._finishAction();
      });
    };
    this.canvas.addEventListener('pointerup', endDrag);
    this.canvas.addEventListener('pointercancel', endDrag);
  }

  _eventPos(e) {
    const rect = this.canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  updateHud() {
    const c = this.core.getClearedPairs();
    const t = this.core.getTotalPairs();
    document.getElementById('progressLabel').textContent = `进度 ${c}/${t}`;
    document.getElementById('ringText').textContent = String(c);
    const pct = (this.core.getProgress() * 100).toFixed(1);
    document.getElementById('progressRing').style.background =
      `conic-gradient(#ffd54f ${pct}%, rgba(255,255,255,0.16) 0)`;
    document.getElementById('progressFill').style.width = pct + '%';
  }

  setMsg(text, ttl = 2200) {
    const el = document.getElementById('msg');
    if (this._msgTimer) { clearTimeout(this._msgTimer); this._msgTimer = null; }
    if (!text) { el.classList.remove('show'); return; }
    el.textContent = text;
    el.classList.add('show');
    this._msgTimer = setTimeout(() => {
      el.classList.remove('show');
      this._msgTimer = null;
    }, ttl);
  }

  _doPick(r, c, tr, tc) {
    const pattern = this.core.getGrid()[r][c];
    const res = this.core.resolvePair(r, c, tr, tc);
    this.picking = null;
    this.view.pick = null;
    if (res.matched) {
      const cellPx = G.pitch;
      const ax = c * cellPx, ay = r * cellPx;
      const tp = this.view.gridToPixel(tr, tc);
      this._registerMatch([{ r, c }, { r: tr, c: tc }], pattern);
      this.view.elimFlash = {
        t0: performance.now(),
        dur: 350,
        pairs: [[ax + G.cell / 2, ay + G.cell / 2, tp.x + G.cell / 2, tp.y + G.cell / 2]],
        removedIds: res.removedIds,
        ghosts: [{ x: ax, y: ay }, { x: tp.x, y: tp.y }],
        pattern,
      };
      this.view.render();
      this.view._animateUntil(350, () => this.view.render(), () => {
        this.view.elimFlash = null;
        this.view.render();
        this._finishAction();
      });
    } else {
      this.busy = false;
    }
    dbg({ type: 'pickResolve', r, c, tr, tc, matched: res.matched });
  }

  _cancelPick() {
    // If the overlay was opened by a drag, revert the committed slide back to
    // the origin before clearing the overlay.
    if (this.picking && this.picking.slide) {
      this.core.revertSlide(this.picking.slide.moved);
    }
    this.picking = null;
    this.view.pick = null;
    this.view.render();
    this.busy = false;
    dbg({ type: 'pickCancel' });
  }

  _finishAction() {
    this.busy = false;
    this.updateHud();
    this.checkWin();
    this.checkMovesLeft();
  }

  // After any board change: if no move can lead to an elimination, nudge the
  // player toward the shuffle button (pulsing) instead of leaving them stuck.
  checkMovesLeft() {
    const btn = document.getElementById('btnShuffle');
    const stuck = this.core.getPatternCount() > 0 && this.core.findHint() === null;
    btn.classList.toggle('attention', stuck);
    if (stuck) {
      this.view.hint = null;
      this.view.render();
      this.setMsg('暂无可消组合，试试洗牌', 2600);
    }
  }

  checkWin() {
    if (this.core.getPatternCount() !== 0) return;
    const secs = Math.max(0, Math.round((performance.now() - this.stats.t0) / 1000));
    const fmt = (s) => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
    const extras = [];
    if (this.stats.hints) extras.push(`提示 ×${this.stats.hints}`);
    if (this.stats.undos) extras.push(`撤销 ×${this.stats.undos}`);
    // persistent best clear time
    let best = null;
    try { best = parseInt(localStorage.getItem('psm.bestTime'), 10) || null; } catch (e) {}
    let recordTag = '';
    if (!best || secs < best) {
      best = secs;
      try { localStorage.setItem('psm.bestTime', String(secs)); } catch (e) {}
      recordTag = ' · 新纪录！';
    } else {
      extras.push(`最佳 ${fmt(best)}`);
    }
    document.getElementById('winStats').textContent =
      `用时 ${fmt(secs)} · 消除 ${this.stats.moves} 对` +
      (extras.length ? ' · ' + extras.join(' · ') : '') + recordTag;
    this.sound.win();
    this.vibrate([16, 40, 16, 40, 60]);
    spawnConfetti(document.getElementById('winOverlay'));
    RenderView.setPaused(true); // freeze the canvas behind the modal
    document.getElementById('winOverlay').classList.remove('hidden');
    document.getElementById('btnShuffle').classList.remove('attention');
  }

  undo() {
    if (!this.core.canUndo()) {
      this.setMsg('没有可撤销的操作');
      return;
    }
    dbg({ type: 'undo' });
    this.stats.undos++;
    this.streak = 0;
    this.core.undo();
    RenderView.setPaused(false); // undo can dismiss the win screen
    // Reset any transient view/input state and repaint from the restored board.
    if (this.view) this.view._bumpToken();
    this.view.drag = null;
    this.view.revert = null;
    this.view.elimFlash = null;
    this.view.bounce = null;
    this.view.pick = null;
    this.view.hint = null;
    this.picking = null;
    this.press = null;
    document.getElementById('winOverlay').classList.add('hidden');
    this.view.render();
    this.busy = false;
    this.updateHud();
    this.checkMovesLeft();
    this.setMsg('已撤销上一步');
  }

  restart() {
    dbg({ type: 'restart' });
    document.getElementById('winOverlay').classList.add('hidden');
    RenderView.setPaused(false); // dialogs (win) may have frozen the loop
    if (this.view) this.view._bumpToken(); // cancel any running animation
    this.busy = false;
    this.press = null;
    this.picking = null;
    this.streak = 0;
    this.stats = this._freshStats();
    this.core.init();
    this.view = new RenderView(this.canvas, this.core);
    this._wireView(this.view);
    document.getElementById('btnShuffle').classList.remove('attention');
    this.setMsg('');
    this.updateHud();
  }
}

// DOM confetti for the win overlay: cheap one-shot CSS animation.
function spawnConfetti(container) {
  if (REDUCED_MOTION) return;
  const colors = ['#ffd54f', '#ff8a65', '#4fc3f7', '#81c784', '#ba68c8', '#fff176'];
  for (let i = 0; i < 30; i++) {
    const p = document.createElement('div');
    p.className = 'confetti';
    p.style.left = Math.random() * 100 + '%';
    p.style.background = colors[i % colors.length];
    p.style.width = (6 + Math.random() * 6) + 'px';
    p.style.height = (8 + Math.random() * 8) + 'px';
    p.style.borderRadius = Math.random() < 0.5 ? '50%' : '2px';
    p.style.animationDuration = (1.6 + Math.random() * 1.6) + 's';
    p.style.animationDelay = (Math.random() * 0.5) + 's';
    p.style.setProperty('--drift', (Math.random() * 120 - 60) + 'px');
    p.addEventListener('animationend', () => p.remove());
    // Safety net: if the overlay is hidden mid-fall, animationend never fires.
    setTimeout(() => p.remove(), 4000);
    container.appendChild(p);
  }
}

window.App = App;

// ================= PWA / ICONS =================
// Bake a 512px PNG icon at runtime and inject it as apple-touch-icon
// (data URI - no network). Deliberately NO manifest link: blob/data manifests
// are best-effort at best, and any <link> resource risks keeping the tab's
// loading indicator busy. The page is fully self-contained instead.
function ensurePwaIcons() {
  try {
    const c = document.createElement('canvas');
    c.width = 512; c.height = 512;
    const ctx = c.getContext('2d');
    const g = ctx.createLinearGradient(0, 0, 512, 512);
    g.addColorStop(0, '#155073'); g.addColorStop(1, '#081f38');
    ctx.fillStyle = g;
    ctx.beginPath();
    roundRectPath(ctx, 0, 0, 512, 512, 112);
    ctx.fill();
    for (const [bx, by, br] of [[90, 120, 16], [420, 380, 22], [400, 110, 12], [120, 400, 14]]) {
      ctx.beginPath(); ctx.arc(bx, by, br, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(190,235,255,0.25)';
      ctx.fill();
    }
    const img = new Image();
    img.onload = () => {
      try {
        ctx.drawImage(img, 56, 56, 400, 400);
        const png = c.toDataURL('image/png');
        const touch = document.createElement('link');
        touch.rel = 'apple-touch-icon';
        touch.href = png;
        document.head.appendChild(touch);
      } catch (e) { /* icons are best-effort */ }
    };
    img.onerror = () => { /* fall back to the SVG favicon in <head> */ };
    img.src = svgDataUri(creatureSvg(1));
  } catch (e) { /* icons are best-effort */ }
}

// ================= START =================
window.app = new App();
ensurePwaIcons();
</script>
